<line x1="475" y1="318" x2="475" y2="293" stroke="#37474f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="20" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#546e7a" >Le rendu web est identique à QGIS : QGIS Server et QGIS Desktop partagent le même moteur de rendu.</text>
