<text x="145" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#263238" >projet.qgs · projet.qgs.cfg</text>
<text x="145" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#263238" >données · media/</text>
<line x1="270" y1="165" x2="348" y2="165" stroke="#37474f" stroke-width="2.5" marker-end="url(#a)"/>
<text x="309" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238" >FTP / TLS</text>
<text x="309" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#263238" >FileZilla</text>
