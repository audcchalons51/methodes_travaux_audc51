<rect x="40" y="88" width="210" height="80" rx="10" fill="#fff" stroke="#2a6db0" stroke-width="2"/>
<text x="145" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238" >QGIS Desktop</text>
<text x="145" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#263238" >+ plugin Lizmap</text>
