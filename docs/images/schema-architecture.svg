<text x="649" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#263238" >navigateur</text>
<rect x="700" y="40" width="180" height="250" rx="10" fill="#fff4e5" stroke="#ef6c00" stroke-width="2"/>
