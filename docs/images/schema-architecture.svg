<text x="475" y="68" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#263238" >2. Serveur Lizmap</text>
<rect x="370" y="88" width="210" height="62" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
<text x="475" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238" >Dossier qgis/</text>
<text x="475" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#263238" >un sous-dossier par thématique</text>
