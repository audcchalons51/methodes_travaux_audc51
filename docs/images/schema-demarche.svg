<circle cx="376" cy="55" r="17" fill="#2a6db0"/><text x="376" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff" >3</text>
<text x="376" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#263238" >Enregistrer</text>
<text x="376" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#263238" >.qgs + .qgs.cfg</text>
<text x="376" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2a6db0" >QGIS</text>
