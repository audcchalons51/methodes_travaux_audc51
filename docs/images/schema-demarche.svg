<text x="450" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#546e7a" >Après la première publication, on ne refait que les étapes 3, 4 et 6 pour une mise à jour.</text>
